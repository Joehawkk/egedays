    <script>if(localStorage.getItem('ege-theme')==='light')document.documentElement.classList.add('light');</script>

  <body class="js-loading">
    <div class="noise" aria-hidden="true"></div>
    <div class="bg-blobs" aria-hidden="true">
      <div class="blob blob--1"></div>
      <div class="blob blob--2"></div>
      <div class="blob blob--3"></div>
    </div>

    <main class="page-shell">
      <section class="intro">
        <div class="intro__text">
          <p class="intro__eyebrow">Время ботать</p>
          <h1>До ЕГЭ 2026<br />осталось</h1>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Сменить тему">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="2" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="5" y2="12"/>

            <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

      <div class="quote" id="quote" aria-label="Цитата дня">
        <p class="quote__text"></p>
        <p class="quote__author"></p>
      </div>

      <section class="settings">
        <div class="settings__group">
          <p class="settings__label">Часовой пояс</p>
          <div class="custom-select" id="tz-select"></div>
        </div>
        <div class="settings__group">
          <p class="settings__label">Мои предметы</p>
          <div class="subject-pills" id="subject-pills"></div>
        </div>
      </section>

      <section class="exam-grid" id="exam-grid" aria-label="Счетчики до ЕГЭ"></section>
    </main>

    <!-- YouTube hidden player -->
    <div style="position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
      <div id="yt-player"></div>
    </div>

    <!-- Lofi mini player -->
    <div class="player" id="player">
      <div class="player__vis" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="player__info">
        <p class="player__title">Lofi Radio</p>
        <p class="player__sub">музыка для учёбы</p>
      </div>
      <button class="player__btn" id="player-btn" aria-label="Воспроизвести">
        <svg class="player__icon player__icon--play" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
