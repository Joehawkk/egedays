<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <title>До ЕГЭ 2026 осталось</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro__content">
          <h1 id="page-title">
            <span>До ЕГЭ 2026</span>
            <span>осталось</span>
          </h1>
        </div>
      </section>

      <section class="exam-grid" aria-label="Счетчики до ЕГЭ">
        <article class="exam-card" data-exam-card>
          <div class="exam-card__top">
            <div>
              <p class="exam-card__date">4 июня, 10:00</p>
              <h2>Русский язык</h2>
            </div>
          </div>
          <div class="countdown" data-target="2026-06-04T10:00:00+03:00">
            <span class="countdown__part"><span data-unit="days">0</span> дн.</span>
            <span class="countdown__part"><span data-unit="hours">0</span> ч.</span>
            <span class="countdown__part"><span data-unit="minutes">0</span> мин.</span>
            <span class="countdown__part"><span data-unit="seconds">0</span> сек.</span>
          </div>
        </article>

        <article class="exam-card" data-exam-card>
          <div class="exam-card__top">
            <div>
              <p class="exam-card__date">8 июня, 10:00</p>
              <h2>Профильная математика</h2>
            </div>
          </div>
          <div class="countdown" data-target="2026-06-08T10:00:00+03:00">
            <span class="countdown__part"><span data-unit="days">0</span> дн.</span>
            <span class="countdown__part"><span data-unit="hours">0</span> ч.</span>
            <span class="countdown__part"><span data-unit="minutes">0</span> мин.</span>
            <span class="countdown__part"><span data-unit="seconds">0</span> сек.</span>
          </div>
        </article>

        <article class="exam-card" data-exam-card>
          <div class="exam-card__top">
            <div>
              <p class="exam-card__date">18 июня, 10:00</p>
              <h2>Информатика</h2>
            </div>
          </div>
          <div class="countdown" data-target="2026-06-18T10:00:00+03:00">
            <span class="countdown__part"><span data-unit="days">0</span> дн.</span>
            <span class="countdown__part"><span data-unit="hours">0</span> ч.</span>
            <span class="countdown__part"><span data-unit="minutes">0</span> мин.</span>
            <span class="countdown__part"><span data-unit="seconds">0</span> сек.</span>
          </div>
        </article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
